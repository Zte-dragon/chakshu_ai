{% extends '_base.html' %}

{% block title %}Register Patient - Chákshu AI{% endblock %}

{% block content %}
<div class="flex">
    <!-- Side Navigation -->
    <div class="w-64 bg-white shadow-md h-screen">
        <nav class="mt-5">
            <a href="{% url 'patient:patients' %}" 
               class="block px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100">
                Patients
            </a>
            <a href="{% url 'patient:register_patient' %}" 
               class="block px-4 py-2 text-sm font-medium text-indigo-600 bg-gray-100 hover:bg-gray-200">
                Register Patient
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 ml-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Register New Patient</h1>
        
        <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                    <p class="text-red-500 text-xs italic">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
                <div class="flex items-center justify-between">
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                        Register Patient
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
